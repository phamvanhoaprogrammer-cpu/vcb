name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Build unsigned IPA
        run: |
          set -e

          xcodebuild \
            -project VCBNotificationRebuild.xcodeproj \
            -scheme VCBNotificationRebuild \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/VCBNotificationRebuild.app \
            Payload/

          zip -qry VCBNotificationRebuild-unsigned.ipa Payload

          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VCBNotificationRebuild-unsigned
          path: VCBNotificationRebuild-unsigned.ipa
          if-no-files-found: error
